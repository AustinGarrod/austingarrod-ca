name: Deploy to HostPapa

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostpapa-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      upload-symbols: true
    secrets: inherit
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.HOSTPAPA_FTP_HOST }}
      FTP_USER: ${{ secrets.HOSTPAPA_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.HOSTPAPA_FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.HOSTPAPA_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download the exact validated distribution
        uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: dist/
      - name: Check deployment secrets
        id: deploy-secrets
        shell: bash
        run: |
          if [[ -n "$FTP_HOST" && -n "$FTP_USER" && -n "$FTP_PASSWORD" && -n "$FTP_REMOTE_DIR" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated dist to HostPapa
        id: ftps-upload
        if: steps.deploy-secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ env.FTP_REMOTE_DIR }}
      - name: Skip deploy notice
        if: steps.deploy-secrets.outputs.ready != 'true'
        run: echo "Skipping HostPapa deploy because required repository secrets are not configured."
      - name: Report failed deployment
        if: failure()
        env:
          REPORTING_STEPS: ${{ toJson(steps) }}
        run: node scripts/report-deployment-failure.mjs
  report-validation-failure:
    needs: validate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Report failed predeployment validation
        env:
          REPORTING_STEPS: '{"validation":{"outcome":"failure"}}'
        run: node scripts/report-deployment-failure.mjs
