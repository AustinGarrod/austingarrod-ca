name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring
          tools: composer:v2

      - name: Bundle and lint PHP
        run: |
          composer install --no-dev --prefer-dist --no-interaction
          php -l public/reporting/bootstrap.php
          php -l public/contact.php
          php -l public/utilities/radius-map/api/geocode.php

      - name: Install asset generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate assets
        run: npm run generate:assets

      - name: Test utilities
        run: npm test

      - name: Build
        run: npm run build

      - name: Write deployment manifest
        run: npm run write:deployment-manifest

      - name: Verify deployment output
        run: npm run verify:dist
